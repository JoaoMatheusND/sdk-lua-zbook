# Lua runtime (lua_zephyr)
CONFIG_LUA=y
CONFIG_LUA_LIB_BASE=y
CONFIG_LUA_LIB_MATH=y
CONFIG_LUA_THREAD_STACK_SIZE=4096
CONFIG_LUA_THREAD_HEAP_SIZE=32768

# ZBook Lua bindings used by the game (each selects its interface driver)
CONFIG_ZBOOK_LUA=y
CONFIG_ZBOOK_LUA_LED=y
CONFIG_ZBOOK_LUA_BTN=y
CONFIG_ZBOOK_LUA_PIN=n

# Long-press on any button aborts the current game
CONFIG_BTN_LONG_PRESS_MS=1500

CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
