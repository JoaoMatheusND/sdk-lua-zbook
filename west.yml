manifest:
  version: "0.13"

  remotes:
    - name: rodrigopex
      url-base: https://github.com/rodrigopex

  projects:
    # Lua runtime for Zephyr: Lua 5.5 core (git submodule), per-thread heap,
    # zbus bindings, REPL and filesystem loader. Pinned: upstream is alpha.
    - name: lua_zephyr
      remote: rodrigopex
      revision: 66fc52fdf36a5c8c9e30addf0b829be3714f3c48
      submodules: true
      path: deps/modules/lua/lua_zephyr
